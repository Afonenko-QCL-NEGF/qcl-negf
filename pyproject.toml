[project]
name = "qcl-negf-workspace"
version = "0.2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "qcl-negf-contracts==0.2.0",
  "qcl-negf-results==0.2.0",
  "aiida-qcl-negf==0.2.0",
  "qcl-negf-api==0.2.0",
]

[dependency-groups]
test = ["pytest>=8.4,<9", "jsonschema>=4.23,<5", "PyYAML>=6,<7"]
build = [
    "build>=1.3,<2",
    "editables>=0.5,<1",
    "hatchling==1.29.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "components/qcl-negf-contracts",
  "components/qcl-negf-results",
  "components/qcl-negf-aiida",
  "components/qcl-negf-portal",
]

[tool.uv.sources]
qcl-negf-contracts = { workspace = true }
qcl-negf-results = { workspace = true }
aiida-qcl-negf = { workspace = true }
qcl-negf-api = { workspace = true }

name: Application release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qcl-negf-application-release
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: [self-hosted, linux, x64, qcl-negf-ci]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify the committed source graph
        run: deno task graph
      - name: Prepare the exact runtime and locked environments
        run: |
          deno task --cwd components/QCLNEGFRunner.jl bootstrap
          deno task prepare
        env:
          JULIA: ${{ github.workspace }}/components/QCLNEGFRunner.jl/.build/julia/bin/julia
      - name: Check and test selected components
        run: |
          deno task check
          deno task test
        env:
          JULIA: ${{ github.workspace }}/components/QCLNEGFRunner.jl/.build/julia/bin/julia
      - name: Retain package artifacts and prepare pinned solver dependencies
        run: |
          deno task release /var/lib/qcl-negf-ci/releases
          deno task solver:depot "$RUNNER_TEMP/depot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        env:
          JULIA: ${{ github.workspace }}/components/QCLNEGFRunner.jl/.build/julia/bin/julia
      - name: Build immutable application and solver closures
        run: |
          deno run --allow-read --allow-write --allow-env --allow-run ops/application_cd.ts \
            "$RUNNER_TEMP/depot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/solver-depot.json" \
            "$RUNNER_TEMP/application-release.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: application-release
          path: ${{ runner.temp }}/application-release.json
          if-no-files-found: error
          retention-days: 30

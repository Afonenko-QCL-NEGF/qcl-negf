name: Application checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-tests:
    runs-on: [self-hosted, linux, x64, qcl-negf-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test Runner with Julia Pkg
        run: >-
          julia --startup-file=no --project=runner -e 'using Pkg;
          Pkg.instantiate(); Pkg.test(; julia_args=["--check-bounds=yes", "--threads=2"])'
        env:
          OPENBLAS_NUM_THREADS: '1'
  analysis-tests:
    runs-on: [self-hosted, linux, x64, qcl-negf-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare Julia dependencies
        run: julia --startup-file=no --project=runner -e 'using Pkg; Pkg.instantiate()'
      - name: Test independent analysis and native producer
        working-directory: analysis
        run: uv run --extra test pytest tests contracts-tests integration

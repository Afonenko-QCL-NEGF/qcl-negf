name: Integrated checks
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Full, changed-source integration, or bounded runner admission check
        type: choice
        options: [full, changed, runner-smoke]
        default: full
      base:
        description: Existing local base ref for changed scope (no fetch)
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: qcl-negf-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integration:
    runs-on: [self-hosted, linux, x64, qcl-negf-ci]
    timeout-minutes: ${{ github.event.inputs.scope == 'runner-smoke' && 5 || 180 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check source graph
        run: deno task graph
      - name: Plan checks from the shared impact registry
        if: github.event.inputs.scope != 'runner-smoke'
        env:
          IMPACT_SCOPE: ${{ github.event.inputs.scope }}
          IMPACT_BASE: ${{ github.event.inputs.base }}
        run: |
          case "$IMPACT_SCOPE" in
            changed) deno task impact --base "$IMPACT_BASE" --head HEAD ;;
            full) deno task impact --full ;;
            *) exit 1 ;;
          esac
      - name: Explicitly prepare selected native environments
        if: github.event.inputs.scope != 'runner-smoke'
        env:
          IMPACT_SCOPE: ${{ github.event.inputs.scope }}
          IMPACT_BASE: ${{ github.event.inputs.base }}
          JULIA: ${{ github.workspace }}/components/QCLNEGFRunner.jl/.build/julia/bin/julia
        run: |
          case "$IMPACT_SCOPE" in
            changed) deno task prepare --base "$IMPACT_BASE" --head HEAD ;;
            full) deno task prepare --full ;;
            *) exit 1 ;;
          esac
      - name: Execute selected checks without preparation
        if: github.event.inputs.scope != 'runner-smoke'
        env:
          IMPACT_SCOPE: ${{ github.event.inputs.scope }}
          IMPACT_BASE: ${{ github.event.inputs.base }}
          JULIA: ${{ github.workspace }}/components/QCLNEGFRunner.jl/.build/julia/bin/julia
        run: |
          case "$IMPACT_SCOPE" in
            changed) deno task test --base "$IMPACT_BASE" --head HEAD ;;
            full) deno task test --full ;;
            *) exit 1 ;;
          esac
      - name: Check typed operations for runner admission
        if: github.event.inputs.scope == 'runner-smoke'
        run: deno task check
      - name: Check isolated runner account and shared build limits
        if: github.event.inputs.scope == 'runner-smoke'
        run: |
          test "$(id -un)" = github-runner-qcl-negf
          case " $(id -Gn) " in
            *" wheel "*|*" qcl-negf-build "*) exit 1 ;;
          esac
          if sudo -n true 2>/dev/null; then
            exit 1
          fi
          id
          nix config show trusted-users
          systemctl show qcl-build.slice -p CPUQuotaPerSecUSec -p MemoryMax -p MemorySwapMax
